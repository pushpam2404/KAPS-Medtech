<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - KAPS MedTech</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <div class="container flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <img src="img/logo.png" alt="KAPS MedTech logo" class="brand-logo">
                    <div class="brand">KAPS <span>MedTech</span></div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="status-badge status-Booked">Doctor</span>
                    <span id="welcome-msg" class="text-white" style="font-weight: 500;">Welcome</span>
                    <button id="logoutBtn" class="btn btn-outline btn-sm" style="margin-left: 1rem;">Logout</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-4">
        <h2>Patient Queue</h2>
        <div id="appointments-list" class="grid grid-cols-1 gap-4 mt-4"></div>
    </main>

    <!-- Treatment Modal -->
    <div id="treatment-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content" style="max-width: 900px;">
            <button id="modal-close-btn" class="close-btn" aria-label="Close dialog">&times;</button>
            <h2 id="modal-title" class="mb-6 border-b border-border pb-2">Patient Treatment</h2>

            <div class="grid grid-cols-2 gap-6">
                <!-- Left: Patient Info & History -->
                <div class="flex flex-col gap-4">
                    <section class="card" style="border-left: 4px solid var(--primary);" aria-label="Patient details">
                        <h3 id="p-name" class="mb-1">Patient Name</h3>
                        <p id="p-details" class="text-muted text-sm font-mono"></p>
                    </section>

                    <section aria-labelledby="heading-history">
                        <h4 id="heading-history" class="mb-2 text-muted uppercase text-xs tracking-wider">Visit History</h4>
                        <div id="p-history" class="custom-scroll"></div>
                    </section>
                </div>

                <!-- Right: Treatment Form -->
                <section aria-labelledby="heading-assessment">
                    <h4 id="heading-assessment" class="mb-4 text-muted uppercase text-xs tracking-wider">Clinical Assessment</h4>
                    <form id="treatment-form">
                        <input type="hidden" id="apt-id">

                        <div class="form-group mb-4">
                            <label class="block text-sm text-muted mb-1" for="diagnosis">Diagnosis</label>
                            <input type="text" id="diagnosis" class="form-input" required
                                placeholder="e.g. Viral Fever">
                        </div>

                        <div class="form-group mb-4">
                            <label class="block text-sm text-muted mb-1" for="advice">Advice / Instructions</label>
                            <textarea id="advice" rows="3" class="form-input"
                                placeholder="Rest for 3 days..."></textarea>
                        </div>

                        <div class="form-group mb-4">
                            <label class="block text-sm text-muted mb-1" for="attached-reports">Attached Reports (Image/PDF)</label>
                            <input type="file" id="attached-reports" class="form-input"
                                accept="image/*,application/pdf">
                        </div>

                        <div class="form-group mb-4">
                            <label class="block text-sm text-muted mb-1" for="follow-up">Follow-up Date</label>
                            <input type="date" id="follow-up" class="form-input">
                        </div>

                        <div class="form-group mb-6">
                            <div class="flex justify-between items-end mb-2">
                                <label class="text-sm text-muted">Prescriptions</label>
                                <button type="button" id="add-med-btn" class="btn btn-outline btn-sm"
                                    style="font-size: 0.7rem;">+ Add Med</button>
                            </div>
                            <div id="med-rows" class="flex flex-col gap-2"></div>
                        </div>

                        <div class="form-group mb-6 p-4 border border-dashed border-gray-700" style="background: rgba(255,255,255,0.01); border-radius: 8px;">
                            <label class="text-xs text-primary uppercase tracking-wide mb-2 block">System Updates (Optional)</label>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="form-group">
                                    <label class="hidden" for="update-phone">New Phone Number</label>
                                    <input type="text" id="update-phone" class="form-input text-sm" placeholder="New Phone Number">
                                </div>
                                <div class="form-group">
                                    <label class="hidden" for="update-id">New ID/License</label>
                                    <input type="text" id="update-id" class="form-input text-sm" placeholder="New ID/License">
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-full py-3">Complete Treatment &rarr;</button>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/dashboard_doctor.js"></script>
</body>

</html>
