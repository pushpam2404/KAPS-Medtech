<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - KAPS MedTech</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="split-layout">
        <!-- Left: Branding -->
        <section class="hero-left" aria-label="Branding">
            <div class="circle-accent"></div>

            <div class="flex items-center gap-3 mb-6" style="z-index: 1;">
                <img src="img/logo.png" alt="KAPS MedTech logo" style="height: 60px;">
                <h1 style="font-size: 3rem; margin:0; letter-spacing: -1px;">KAPS <span
                        style="color:var(--primary)">MedTech</span></h1>
            </div>

            <h2 style="font-size: 3.5rem; line-height: 1.1; margin-bottom: 1.5rem; z-index: 1;">
                Next Level <br>
                <span class="text-primary">Health Support.</span>
            </h2>
            <p class="text-muted" style="font-size: 1.25rem; max-width: 550px; line-height: 1.6; z-index: 1;">
                Skip the lines. Get instant access to doctors, manage prescriptions, and track your wellness journey—all
                from one secure dashboard.
            </p>
        </section>

        <!-- Right: Login Form -->
        <section class="hero-right" aria-label="Account Access">
            <h2 class="text-center mb-6">Welcome Back</h2>

            <!-- Tabs -->
            <div class="flex mb-8 border-b border-border" role="tablist" aria-label="Auth modes">
                <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="login-form">Login</button>
                <button class="tab-btn" role="tab" aria-selected="false" aria-controls="signup-form">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="mb-2">
                    <label class="block text-sm text-muted mb-2" for="l-email">Email Address</label>
                    <input type="email" id="l-email" class="form-input" placeholder="student@university.edu" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm text-muted mb-2" for="l-password">Password</label>
                    <input type="password" id="l-password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-full" style="padding: 1rem;">Access Account
                    &rarr;</button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="hidden">
                <!-- Role Selection -->
                <label class="block text-sm text-muted mb-2">I am a...</label>
                <div class="grid grid-cols-3 gap-2 mb-4" role="group" aria-label="Choose registration role">
                    <button type="button" class="role-card active" id="role-student">
                        Student
                    </button>
                    <button type="button" class="role-card" id="role-staff">
                        Staff
                    </button>
                    <button type="button" class="role-card" id="role-doctor">
                        Doctor
                    </button>
                </div>
                <input type="hidden" id="s-role" value="student">

                <div class="mb-2">
                    <label class="block text-sm text-muted mb-2" for="s-name">Full Name</label>
                    <input type="text" id="s-name" class="form-input" placeholder="John Doe" required>
                </div>
                <div class="mb-2">
                    <label class="block text-sm text-muted mb-2" for="s-email">Email Address</label>
                    <input type="email" id="s-email" class="form-input" placeholder="student@university.edu" required>
                </div>
                <div class="mb-2">
                    <label class="block text-sm text-muted mb-2" for="s-password">Password</label>
                    <input type="password" id="s-password" class="form-input" placeholder="••••••••" required>
                </div>

                <!-- Doctor Specific Fields -->
                <div id="doctor-fields" class="hidden">
                    <div class="mb-2">
                        <label class="block text-sm text-muted mb-2" for="s-dept">Department</label>
                        <select id="s-dept" class="form-input">
                            <option value="General Medicine">General Medicine</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Pulmonology">Pulmonology</option>
                            <option value="Gastroenterology">Gastroenterology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Dermatology">Dermatology</option>
                            <option value="Psychiatry">Psychiatry</option>
                            <option value="ENT">ENT</option>
                            <option value="Ophthalmology">Ophthalmology</option>
                            <option value="Endocrinology">Endocrinology</option>
                            <option value="Nephrology">Nephrology</option>
                            <option value="Dentistry">Dentistry</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="block text-sm text-muted mb-2" for="s-specialty">Specialty</label>
                        <input type="text" id="s-specialty" class="form-input" placeholder="e.g. Senior Surgeon">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-full" style="padding: 1rem;">Create Account
                    &rarr;</button>
            </form>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
