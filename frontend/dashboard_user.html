<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KAPS MedTech</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <div class="container flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <img src="img/logo.png" alt="KAPS MedTech logo" class="brand-logo">
                    <div class="brand">KAPS <span>MedTech</span></div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="role-badge" class="status-badge status-Completed">Student</span>
                    <span id="welcome-msg" class="text-white">Welcome</span>
                    <button id="logoutBtn" class="btn btn-outline btn-sm" style="margin-left: 1rem;">Logout</button>
                </div>
            </div>
        </nav>
    </header>

    <div class="container dashboard-layout">
        <nav class="sidebar-nav" aria-label="Dashboard navigation">
            <div class="sidebar-menu">
                <button class="menu-item active" data-view="view-book">Book Appointment</button>
                <button class="menu-item" data-view="view-appointments">My Appointments</button>
                <button class="menu-item" data-view="view-records">Medical Records</button>
                <button class="menu-item" data-view="view-medicine">My Medicine</button>
                <button class="menu-item" data-view="view-reminders">Reminders</button>
            </div>
        </nav>

        <main class="main-content">
            <!-- 1. Book Appointment -->
            <section id="view-book" class="view-section" aria-labelledby="heading-book">
                <h2 id="heading-book" class="mb-4">Book Appointment</h2>
                <div class="card">

                    <!-- Step 1: Reason + Dept -->
                    <div id="book-step-1">
                        <div class="form-group mb-4">
                            <label class="block mb-2 text-sm text-muted" for="symptom-input">Reason for Appointment</label>
                            <input type="text" id="symptom-input" class="form-input" list="symptoms-datalist"
                                placeholder="Select a common symptom or type your own...">
                            <datalist id="symptoms-datalist">
                                <option value="Fever / Shivering">
                                <option value="Common Cold / Runny Nose">
                                <option value="Cough and Sore Throat">
                                <option value="Chest Pain / Pressure">
                                <option value="Heart Palpitations / Racing Pulse">
                                <option value="Asthma / Difficulty Breathing">
                                <option value="Stomach Ache / Acid Heartburn">
                                <option value="Nausea / Vomiting">
                                <option value="Diarrhea / Loose Stools">
                                <option value="Constipation / Gas Bloating">
                                <option value="Headache / Severe Migraine">
                                <option value="Dizziness / Vertigo Loss of Balance">
                                <option value="Numbness / Tingling in Limbs">
                                <option value="Knee Pain / Bone Injury">
                                <option value="Severe Back Pain / Joint Stiffness">
                                <option value="Muscle Strain / Joint Sprain">
                                <option value="Skin Rash / Itchy Spots">
                                <option value="Acne / Pimples Breakout">
                                <option value="Severe Anxiety / Insomnia">
                                <option value="Depressed Mood / Sleep Issues">
                                <option value="Ear Pain / Hearing Loss">
                                <option value="Sinus Pressure / Blocked Nose">
                                <option value="Blurry Vision / Eye Redness">
                                <option value="Toothache / Cavity Pain">
                                <option value="Bleeding Gums / Tooth Sensitivity">
                                <option value="Urinary Infection / Painful Urination">
                                <option value="Thyroid / Sudden Weight Changes">
                            </datalist>
                            <div id="symptom-suggestion" class="text-sm mt-2 hidden" style="font-weight:600; padding:0.5rem 0.75rem; border-radius:6px; display:inline-block;"></div>
                        </div>
                        <label class="mb-2 block text-sm text-muted">Select Department</label>
                        <div class="dept-grid">
                            <button type="button" class="dept-card" data-dept="General Medicine">
                                <span>General Medicine</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Fever, cold, general health checkups</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Cardiology">
                                <span>Cardiology</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Heart, chest pain, pulse issues</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Pulmonology">
                                <span>Pulmonology</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Lung, breathing, asthma & cough</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Gastroenterology">
                                <span>Gastroenterology</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Stomach, digestion, food poisoning</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Neurology">
                                <span>Neurology</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Brain, migraines, nerve & balance</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Orthopedics">
                                <span>Orthopedics</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Bone, joint & muscle pain / injuries</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Dermatology">
                                <span>Dermatology</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Skin, rashes, eczema & acne</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Psychiatry">
                                <span>Psychiatry</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Mental health, anxiety & depression</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="ENT">
                                <span>ENT</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Ear, nose & throat conditions</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Ophthalmology">
                                <span>Ophthalmology</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Eye care, vision & irritation</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Endocrinology">
                                <span>Endocrinology</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Hormones, diabetes & thyroid</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Nephrology">
                                <span>Nephrology</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Kidney, bladder & urinary tract</small>
                            </button>
                            <button type="button" class="dept-card" data-dept="Dentistry">
                                <span>Dentistry</span>
                                <small class="text-xs text-muted" style="font-weight: normal; margin-top: 2px;">Teeth, gum pain & cavity care</small>
                            </button>
                        </div>
                    </div>

                    <!-- Step 2: Doctor -->
                    <div id="book-step-2" class="hidden">
                        <div class="flex items-center gap-2 mb-4">
                            <button id="back-to-step-1" class="btn btn-outline btn-sm">
                                &lt; Back
                            </button>
                            <h4 style="margin:0">Select Doctor (<span id="selected-dept" class="text-primary"></span>)</h4>
                        </div>
                        <div id="doctors-list" class="grid grid-cols-2 gap-2"></div>
                    </div>

                    <!-- Step 3: Slots -->
                    <div id="book-step-3" class="hidden">
                        <div class="flex items-center gap-2 mb-4">
                            <button id="back-to-step-2" class="btn btn-outline btn-sm">
                                &lt; Back
                            </button>
                            <h4 style="margin:0">Select Slot</h4>
                        </div>
                        <div class="form-group mb-4">
                            <label class="block mb-2 text-sm text-muted" for="book-date">Choose Date</label>
                            <input type="date" id="book-date" class="form-input" style="max-width: 200px;">
                        </div>
                        <div id="slots-container" class="slots-grid"></div>
                        <button id="confirm-book-btn" class="btn btn-primary w-full mt-4 hidden">Confirm Booking</button>
                    </div>

                </div>
            </section>

            <!-- 2. My Appointments -->
            <section id="view-appointments" class="view-section hidden" aria-labelledby="heading-appointments">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="heading-appointments">My Appointments</h2>
                    <div class="flex gap-2">
                        <input type="date" id="filter-start" class="form-input"
                            style="padding: 0.5rem; width: auto; margin:0" aria-label="Start date filter">
                        <input type="date" id="filter-end" class="form-input"
                            style="padding: 0.5rem; width: auto; margin:0" aria-label="End date filter">
                        <button id="filter-date-btn" class="btn btn-primary btn-sm">Filter</button>
                    </div>
                </div>
                <!-- Search Reason -->
                <div class="mb-4 flex gap-2">
                    <input type="text" id="filter-reason" class="form-input" placeholder="Search by reason..."
                        style="margin-bottom:0" aria-label="Search by symptom reason">
                    <button id="filter-reason-btn" class="btn btn-outline">Search</button>
                </div>

                <div id="appointments-list" class="flex flex-col gap-2"></div>
            </section>

            <!-- 3. Medical Records -->
            <section id="view-records" class="view-section hidden" aria-labelledby="heading-records">
                <h2 id="heading-records" class="mb-4">Medical Records</h2>
                <div id="records-list" class="flex flex-col gap-2"></div>
            </section>

            <!-- 4. Medicine -->
            <section id="view-medicine" class="view-section hidden" aria-labelledby="heading-medicine">
                <h2 id="heading-medicine" class="mb-4">My Medicine</h2>
                <div id="medicine-list" class="dept-grid"></div>
            </section>

            <!-- 5. Reminders -->
            <section id="view-reminders" class="view-section hidden" aria-labelledby="heading-reminders">
                <h2 id="heading-reminders" class="mb-4">Follow-up Reminders</h2>
                <div id="reminders-list" class="flex flex-col gap-2"></div>
            </section>
        </main>
    </div>

    <!-- Record Modal -->
    <div id="record-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content relative">
            <button id="record-modal-close" class="close-btn" aria-label="Close dialog">&times;</button>
            <div id="record-modal-content"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/dashboard_user.js"></script>
</body>

</html>
